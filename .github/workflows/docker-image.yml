name: Build and Push Docker Image

on:
  # 允许手动点击按钮触发构建
  workflow_dispatch:
  # 当推送到 main 分支时自动触发（可选）
  push:
    branches:
      - docker-build

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 环境

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 QEMU (用于跨平台构建，虽然这里主要是 x86，但加上是最佳实践)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx (构建工具)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 注意：这里请修改为您自己的镜像名称
          # 格式：您的DockerHub用户名/镜像名:标签
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pocket-tts:latest
          # 缓存优化，加快二次构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max
